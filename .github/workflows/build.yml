# Builds Nano Java in the same Docker image used locally (docker/Dockerfile),
# runs the tests and keeps the DS ROM as an artifact. Pushing a tag named
# v* also publishes a GitHub release with the ROM attached.
name: Build

on:
  push:
    branches: [main, "2.0"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the build image
        run: docker build -t nanojava-build docker

      - name: Class library and desktop build
        run: docker run --rm -v "$PWD":/src -w /src nanojava-build make classlib host

      - name: Tests
        run: docker run --rm -v "$PWD":/src -w /src nanojava-build make test

      - name: Nintendo DS ROM
        run: docker run --rm -v "$PWD":/src -w /src nanojava-build make nds

      - uses: actions/upload-artifact@v4
        with:
          name: nanojava
          path: |
            build/nanojava.nds
            build/classlib.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/nanojava.nds \
            --title "Nano Java $GITHUB_REF_NAME" --generate-notes \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
